name: Gated green-change auto-merge

# Runs only after the existing test workflow succeeds. Never checks out or
# executes pull-request code. Only explicitly labelled, allowlisted changes
# can be merged.
on:
  workflow_run:
    workflows: ["Concurrency hardening tests"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  gated-automerge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge only explicitly approved, low-risk runtime changes
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const fullRepo = `${owner}/${repo}`;

            // GitHub's workflow_run payload often omits pull_requests even
            // for PR-triggered test runs. Resolve the PR from the exact tested
            // head SHA rather than silently disabling the merge gate.
            let prs = run.pull_requests || [];
            if (prs.length === 0) {
              const open = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'open',
                base: 'jbsn-aios-runtime-bootstrap', per_page: 100
              });
              prs = open.filter(pr => pr.head.sha === run.head_sha);
            }
            if (prs.length !== 1) {
              core.info('Skipping: could not identify exactly one open PR for the tested head SHA.');
              return;
            }

            const candidate = prs[0];
            const { data: details } = await github.rest.pulls.get({
              owner, repo, pull_number: candidate.number
            });
            if (details.state !== 'open' || details.draft) {
              core.info('Skipping: pull request is not open and ready.');
              return;
            }
            if (details.base.ref !== 'jbsn-aios-runtime-bootstrap' ||
                details.head.repo?.full_name !== fullRepo) {
              core.info('Skipping: base branch or repository is not allowlisted.');
              return;
            }
            if (!details.labels.some(label => label.name === 'autonomy:green')) {
              core.info('Skipping: missing explicit autonomy:green label.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: details.number, per_page: 100
            });
            const allowed = /^aios-runtime\/(main\.py|tests\/[^/]+\.py)$/;
            if (files.length === 0 || files.some(file => !allowed.test(file.filename))) {
              core.info('Skipping: PR contains files outside the narrow runtime/test allowlist.');
              return;
            }

            // Never merge code different from the tested head.
            if (details.head.sha !== run.head_sha) {
              core.info('Skipping: PR head changed after the test run.');
              return;
            }
            const checks = await github.rest.checks.listForRef({
              owner, repo, ref: run.head_sha, per_page: 100
            });
            const relevant = checks.data.check_runs.filter(check =>
              check.name === 'test' && check.app?.slug === 'github-actions'
            );
            if (relevant.length === 0 ||
                relevant.some(check => check.status !== 'completed' || check.conclusion !== 'success')) {
              core.info('Skipping: required test check is missing or not successful.');
              return;
            }

            await github.rest.pulls.merge({
              owner, repo, pull_number: details.number,
              sha: details.head.sha, merge_method: 'squash'
            });
            core.info(`Merged allowlisted green PR #${details.number} after successful tests.`);
