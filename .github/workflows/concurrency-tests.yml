name: Concurrency hardening tests

on:
  pull_request:
    branches:
      - jbsn-aios-runtime-bootstrap
      - jbsn-aios-concurrency-hardening
  push:
    branches:
      - jbsn-aios-concurrency-hardening
      - jbsn-aios-task-recovery

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jbsn_test
          POSTGRES_PASSWORD: jbsn_test_password
          POSTGRES_DB: jbsn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jbsn_test -d jbsn_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      JBSN_TEST_POSTGRES_DSN: postgresql://jbsn_test:jbsn_test_password@localhost:5432/jbsn_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and PostgreSQL integration tests
        working-directory: aios-runtime
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q aios-runtime
