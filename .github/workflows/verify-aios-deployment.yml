name: Verify JBSN AI OS deployment

on:
  push:
    branches:
      - jbsn-aios-runtime-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Render runtime to become healthy
        shell: bash
        run: |
          set -euo pipefail
          url="https://jbsn-aios-core-postgres.onrender.com/health"
          for attempt in $(seq 1 36); do
            echo "Health check attempt ${attempt}/36"
            if body="$(curl --silent --show-error --fail --max-time 10 "$url")"; then
              echo "$body" | jq .
              if echo "$body" | jq -e '
                .status == "healthy" and
                .database == "postgresql" and
                .persistent_storage_configured == true and
                .worker.enabled == true and
                (.worker.registry | index("plan") != null)
              ' >/dev/null; then
                echo "JBSN AI OS runtime health/readiness checks passed."
                exit 0
              fi
              echo "Service responded but readiness fields are not all satisfied."
            else
              echo "Runtime is not responding yet."
            fi
            sleep 10
          done
          echo "Runtime did not reach the required readiness state within six minutes."
          exit 1
